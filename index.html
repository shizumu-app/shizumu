<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: let the soft keyboard shrink the
         LAYOUT viewport, not just the visual one. Without it the default is
         resizes-visual, so .app-shell's 100dvh stayed full-screen-height with
         the keyboard up; focusing the bottom-anchored "what settled" field
         made the browser scroll the whole shell to reveal it, pushing the
         header, the title and the page's blocks off the top of the screen.
         What the user was left looking at was the empty tail of the canvas. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>shizumu</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/prose.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
