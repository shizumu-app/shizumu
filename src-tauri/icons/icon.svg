<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- background: warm cream rounded square (rx=108, matches macOS squircle) -->
  <rect width="512" height="512" rx="108" fill="#f5f0e8"/>

  <!-- the settling line — bold horizontal stroke, near the top to leave room for ripples -->
  <line x1="44" y1="92" x2="468" y2="92" stroke="#c44d28" stroke-width="28" stroke-linecap="round"/>

  <!-- the drop — anchors the moment the ink touches the page -->
  <circle cx="256" cy="116" r="15" fill="#c44d28"/>

  <!-- ripple 1: closest, strongest -->
  <path d="M 140 200 Q 256 252 372 200" fill="none" stroke="#c44d28" stroke-width="22" stroke-linecap="round" opacity="0.9"/>

  <!-- ripple 2: wider, softer -->
  <path d="M 104 298 Q 256 358 408 298" fill="none" stroke="#c44d28" stroke-width="18" stroke-linecap="round" opacity="0.6"/>

  <!-- ripple 3: widest, faintest but still readable at 32px -->
  <path d="M 72 398 Q 256 460 440 398" fill="none" stroke="#c44d28" stroke-width="14" stroke-linecap="round" opacity="0.35"/>
</svg>
